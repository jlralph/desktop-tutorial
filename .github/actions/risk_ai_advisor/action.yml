name: "Risk AI Advisor"
description: >-
  Uses an AI model (via GitHub Models) to weigh open CodeQL code-scanning
  alerts and open Dependabot alerts together and produce an overall risk
  verdict for releasing a build to a public-facing website. Advisory by
  default; can optionally fail the job when the AI risk level meets a
  configurable threshold.
author: "security-engineering"

inputs:
  github-token:
    description: >-
      Token used to (1) read CodeQL code-scanning alerts and (2) call the
      GitHub Models inference API. The default GITHUB_TOKEN works when the
      calling job grants 'security-events: read' and 'models: read'.
    required: false
    default: ${{ github.token }}
  dependabot-token:
    description: >-
      Token with permission to read Dependabot alerts. The default
      GITHUB_TOKEN typically CANNOT read Dependabot alerts — provide a
      fine-grained PAT (repository permission "Dependabot alerts: read" +
      "Metadata: read") or a GitHub App installation token. Defaults to
      github-token; if that can't read alerts, Dependabot input is treated
      as empty and the advisor proceeds on CodeQL alerts alone.
    required: false
    default: ${{ github.token }}
  repository:
    description: "Repository to assess in owner/repo format."
    required: false
    default: ${{ github.repository }}
  model:
    description: >-
      GitHub Models model to use, in '{publisher}/{model}' form
      (e.g. 'openai/gpt-4.1').
    required: false
    default: "openai/gpt-4.1"
  deployment-environment:
    description: >-
      Deployment environment and its exposure, given to the model as context to
      calibrate reachability and blast radius (e.g. "production - public
      internet-facing", "production - internal-only network", "staging -
      internal-only network"). State whether the target is public/internet-facing
      or internal-only: public-facing environments increase the weight of remotely
      exploitable findings; internal-only lowers it. Defaults to the
      highest-exposure case.
    required: false
    default: "production - public internet-facing"
  app-context:
    description: >-
      Free-text description of what is being released and its exposure, given
      to the model as context (e.g. "Public-facing Java web app handling user
      auth and payments, deployed to the internet"). Sharper context yields a
      sharper verdict.
    required: false
    default: "A build being released to a public-facing, internet-exposed website."
  mitigations:
    description: >-
      Compensating controls already deployed in front of the build (e.g. a WAF,
      load balancer, CDN with DDoS protection, network isolation, rate limiting),
      given to the model so it can weigh them when judging exploitability and
      blast radius. Provide a human-readable list — the calling workflow builds
      this from the manual-run checkboxes. Empty (default) means none specified.
      Controls are treated as risk-reducing but not a guarantee, so critical or
      known-exploited findings are never dismissed on their basis alone.
    required: false
    default: ""
  fail-on:
    description: >-
      AI risk level at or above which the job fails, treated as a severity
      THRESHOLD (e.g. 'high' fails on high and critical; 'medium' fails on
      medium, high, and critical). Leave empty (default) for advisory-only
      behavior — the verdict is always reported but never blocks. If multiple
      comma-separated levels are given, the least severe one is used as the
      threshold. Valid levels: critical, high, medium, low, minimal.
    required: false
    default: ""
  code-scanning-tool:
    description: >-
      Name of the code-scanning tool whose alerts to assess (matches the GitHub
      code-scanning API 'tool_name' filter). Defaults to 'CodeQL', so alerts
      uploaded by other SARIF scanners are excluded. Set to a different tool name
      to target that scanner, or to 'all' (or empty) to include every tool.
    required: false
    default: "CodeQL"
  max-alerts:
    description: >-
      Maximum number of alerts of EACH type (CodeQL, Dependabot) to send to the
      model, highest-severity first, to bound the prompt size. The action also
      auto-trims the payload (slimming per-alert fields and further reducing this
      count) to stay within the model's input-token limit, so requests don't fail
      with HTTP 413. Counts are always reported in full even when the detail list
      is truncated.
    required: false
    default: "75"
  upload-report:
    description: "Upload the JSON advisory report as a workflow artifact."
    required: false
    default: "true"
  report-retention-days:
    description: "Artifact retention period in days for the advisory report."
    required: false
    default: "90"
  attest-report:
    description: >-
      Generate a signed build-provenance attestation for the advisory report
      (Sigstore keyless signing via OIDC). The attestation binds the report's
      digest to this workflow run and repository so its authenticity can be
      verified later with `gh attestation verify`. Requires the calling workflow
      to grant 'id-token: write' and 'attestations: write'.
    required: false
    default: "true"
  attest-model-io:
    description: >-
      Generate a signed build-provenance attestation for the model I/O record —
      the exact request (system + user prompt with all inputs resolved) and the
      model's response (raw API body + parsed verdict). Binds the record's digest
      to this workflow run so the inference itself, not just the derived verdict,
      can be verified later with `gh attestation verify`. Independent of
      attest-report; requires 'id-token: write' and 'attestations: write'.
    required: false
    default: "true"

outputs:
  result:
    description: "'advisory' (no fail-on set), 'pass', or 'fail'."
    value: ${{ steps.advise.outputs.result }}
  risk-level:
    description: "AI-assessed overall risk: critical | high | medium | low | minimal."
    value: ${{ steps.advise.outputs.risk-level }}
  recommendation:
    description: "AI release recommendation: block | conditional-go | go."
    value: ${{ steps.advise.outputs.recommendation }}
  summary:
    description: "One-line AI summary of the release risk."
    value: ${{ steps.advise.outputs.summary }}
  codeql-open:
    description: "Number of open CodeQL code-scanning alerts considered."
    value: ${{ steps.advise.outputs.codeql-open }}
  dependabot-open:
    description: "Number of open Dependabot alerts considered."
    value: ${{ steps.advise.outputs.dependabot-open }}
  kev-matched:
    description: "Number of distinct CVEs across open Dependabot alerts that are in the CISA KEV catalog (actively exploited)."
    value: ${{ steps.advise.outputs.kev-matched }}
  audited-commit:
    description: "The commit SHA this assessment is tied to."
    value: ${{ steps.advise.outputs.audited-commit }}
  report-path:
    description: "Path to the JSON advisory report."
    value: ${{ steps.advise.outputs.report-path }}
  model-io-path:
    description: "Path to the JSON model I/O record (prompt, context, and response)."
    value: ${{ steps.advise.outputs.model-io-path }}
  attestation-url:
    description: "URL of the signed provenance attestation for the advisory report file."
    value: ${{ steps.attest.outputs.attestation-url }}
  model-io-attestation-url:
    description: "URL of the signed provenance attestation for the model I/O record."
    value: ${{ steps.attest-model-io.outputs.attestation-url }}
  bundle-attestation-url:
    description: "URL of the signed provenance attestation for the uploaded artifact bundle."
    value: ${{ steps.attest-bundle.outputs.attestation-url }}

runs:
  using: "composite"
  steps:
    # Cache the CISA KEV catalog across runs. The key carries the UTC date so the
    # cache refreshes once per day (the catalog updates ~daily); every other run
    # that day restores the small JSON map instead of re-downloading it.
    - name: Resolve KEV cache metadata
      id: kev-cache-meta
      shell: bash
      run: |
        {
          echo "date=$(date -u +%Y-%m-%d)"
          echo "dir=${RUNNER_TEMP}/cisa-kev-cache"
        } >> "$GITHUB_OUTPUT"

    - name: Cache CISA KEV catalog
      uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
      with:
        path: ${{ steps.kev-cache-meta.outputs.dir }}
        key: cisa-kev-catalog-${{ steps.kev-cache-meta.outputs.date }}

    - name: Assess release risk with AI
      id: advise
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        DEPENDABOT_TOKEN: ${{ inputs.dependabot-token }}
        MODELS_TOKEN: ${{ inputs.github-token }}
        REPOSITORY: ${{ inputs.repository }}
        MODEL: ${{ inputs.model }}
        DEPLOYMENT_ENVIRONMENT: ${{ inputs.deployment-environment }}
        APP_CONTEXT: ${{ inputs.app-context }}
        MITIGATIONS: ${{ inputs.mitigations }}
        FAIL_ON: ${{ inputs.fail-on }}
        MAX_ALERTS: ${{ inputs.max-alerts }}
        CODE_SCANNING_TOOL: ${{ inputs.code-scanning-tool }}
        KEV_CACHE_DIR: ${{ steps.kev-cache-meta.outputs.dir }}
      run: bash "${{ github.action_path }}/risk_ai_advisor.sh"

    - name: Sign advisory report (provenance attestation)
      id: attest
      if: ${{ always() && inputs.attest-report == 'true' && steps.advise.outputs.report-path != '' }}
      uses: actions/attest-build-provenance@v2
      with:
        subject-path: ${{ steps.advise.outputs.report-path }}

    - name: Sign model I/O record (provenance attestation)
      id: attest-model-io
      if: ${{ always() && inputs.attest-model-io == 'true' && steps.advise.outputs.model-io-path != '' }}
      uses: actions/attest-build-provenance@v2
      with:
        subject-path: ${{ steps.advise.outputs.model-io-path }}

    - name: Upload advisory report artifact
      id: upload
      if: ${{ always() && inputs.upload-report == 'true' && steps.advise.outputs.report-path != '' }}
      uses: actions/upload-artifact@v4
      with:
        name: risk-ai-advisor-report-${{ github.sha }}
        path: |
          ${{ steps.advise.outputs.report-path }}
          ${{ steps.advise.outputs.model-io-path }}
        retention-days: ${{ inputs.report-retention-days }}

    - name: Sign uploaded artifact bundle (provenance attestation)
      id: attest-bundle
      if: ${{ always() && inputs.attest-report == 'true' && steps.upload.outputs.artifact-digest != '' }}
      uses: actions/attest-build-provenance@v2
      with:
        subject-name: risk-ai-advisor-report-${{ github.sha }}.zip
        subject-digest: sha256:${{ steps.upload.outputs.artifact-digest }}
