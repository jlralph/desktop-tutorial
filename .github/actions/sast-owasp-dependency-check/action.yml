name: 'SAST OWASP Dependency Check'
description: 'Builds a Spring Boot app and runs an OWASP Dependency Check scan against it'

inputs:
  nvd-api-key:
    description: 'NVD API key for fetching the latest CVE database'
    required: true
  pom-file:
    description: 'Path to the Maven POM file'
    required: false
    default: 'pom.xml'
  max-cvss-score:
    description: 'Fail the scan if any dependency has a CVSS score above this threshold'
    required: false
    default: '8'
  report-dir:
    description: 'Directory where the dependency check report is written'
    required: false
    default: 'dependency-check-report'
  format:
    description: 'Report format: HTML, XML, CSV, JSON, JUNIT, SARIF, or ALL'
    required: false
    default: 'JSON'
  github-token:
    description: 'GitHub token used to create one issue per CVE found. Requires issues:write. If omitted, issue creation is skipped.'
    required: false
    default: ''

runs:
  using: composite
  steps:
    - name: Restore cached Maven dependencies
      uses: actions/cache/restore@v3
      with:
        path: ~/.m2/repository
        # Using datetime in cache key as OWASP database may change, without the pom changing
        key: ${{ runner.os }}-maven-${{ steps.get-date.outputs.datetime }}-${{ hashFiles('**/pom.xml') }}
        restore-keys: |
          ${{ runner.os }}-maven-${{ steps.get-date.outputs.datetime }}
          ${{ runner.os }}-maven-

    - name: Resolve JAVA_HOME from PATH
      shell: bash
      run: echo "APP_JAVA_HOME=$(dirname $(dirname $(readlink -f $(which java))))" >> $GITHUB_ENV

    - name: Build Spring Boot app
      shell: bash
      env:
        JAVA_HOME: ${{ env.APP_JAVA_HOME }}
      run: mvn -B package -DskipTests --file ${{ inputs.pom-file }}

    - name: Get Date
      id: get-date
      shell: bash
      run: echo "datetime=$(/bin/date -u "+%Y%m%d%H")" >> $GITHUB_OUTPUT

    - name: Build & scan
      id: scan
      shell: bash
      env:
        JAVA_HOME: ${{ env.APP_JAVA_HOME }}
      run: |
        mvn --no-transfer-progress clean package -DskipTests \
          -DnvdApiKey=${{ inputs.nvd-api-key }} \
          -DskipITs \
          -Dmax.cvss.score=${{ inputs.max-cvss-score }} \
          -DnodeAuditSkip=true \
          -Dformat=${{ inputs.format }} \
          -DprettyPrint \
          -Dodc.outputDirectory=${{ github.workspace }}/${{ inputs.report-dir }} \
          org.owasp:dependency-check-maven:check

    - name: Create GitHub issues for CVEs
      if: always() && inputs.github-token != ''
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.github-token }}
      run: |
        REPORT="${{ github.workspace }}/${{ inputs.report-dir }}/dependency-check-report.json"
        if [[ -f "$REPORT" ]]; then
          bash "${{ github.workspace }}/scripts/create-cve-issues.sh" "$REPORT" "${{ github.repository }}"
        else
          echo "Report not found at $REPORT — skipping issue creation."
        fi

    - name: Upload scan artifacts
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: dependency-check-results
        path: ${{ github.workspace }}/${{ inputs.report-dir }}/
        retention-days: 30

    - name: Cache Maven dependencies
      uses: actions/cache/save@v3
      if: always()
      with:
        path: ~/.m2/repository
        key: ${{ runner.os }}-maven-${{ steps.get-date.outputs.datetime }}-${{ hashFiles('**/pom.xml') }}
