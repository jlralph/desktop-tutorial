name: "Risk SLA Gate"
description: >-
  Audits open Dependabot alerts against severity-based remediation SLAs
  (measured from the CVE published date) and ties the result to a specific
  commit for compliance audits. Runs in 'enforce' or 'audit' mode, with
  enforcement configurable per severity.
author: "security-engineering"

inputs:
  github-token:
    description: >-
      Token with permission to read Dependabot alerts. Note: the default
      GITHUB_TOKEN typically CANNOT read Dependabot alerts. Use a fine-grained
      PAT (repository permission "Dependabot alerts: read") or a GitHub App
      installation token.
    required: true
  repository:
    description: "Repository to audit in owner/repo format."
    required: false
    default: ${{ github.repository }}
  mode:
    description: >-
      'enforce' (fail the job on SLA violations) or 'audit' (report only). Note:
      when 'ai-assess' is true the deterministic SLA check is always audit-only
      and never fails the job on its own — enforcement is delegated to the AI
      verdict, which still requires mode 'enforce' to block.
    required: false
    default: "audit"
  severity-threshold:
    description: >-
      Single minimum severity that governs BOTH gates and filters the alert set.
      When set to 'critical', 'high', 'medium', or 'low', only alerts at that
      severity OR HIGHER are evaluated, reported, and sent to the AI — anything
      below is filtered out entirely (counts, compliance report, step summary,
      and AI prompt). The deterministic SLA gate enforces on those in-scope
      severities, and the AI verdict's fail-on level is set to this same
      threshold, so one knob drives both. Leave empty (default) for no threshold:
      all severities are in scope, and in 'enforce' mode with AI off any SLA
      violation can fail the job (the AI stays advisory).
    required: false
    default: ""
  sla-critical:
    description: "Remediation SLA in days for critical severity."
    required: false
    default: "7"
  sla-high:
    description: "Remediation SLA in days for high severity."
    required: false
    default: "30"
  sla-medium:
    description: "Remediation SLA in days for medium severity."
    required: false
    default: "60"
  sla-low:
    description: "Remediation SLA in days for low severity."
    required: false
    default: "90"
  upload-report:
    description: "Upload the JSON compliance report as a workflow artifact."
    required: false
    default: "true"
  report-retention-days:
    description: "Artifact retention period in days for the compliance report."
    required: false
    default: "90"
  attest-report:
    description: >-
      Generate a signed build-provenance attestation for the compliance
      report (Sigstore keyless signing via OIDC). The attestation binds the
      report's digest to this workflow run and commit so its authenticity can
      be verified later with `gh attestation verify`. Requires the calling
      workflow to grant 'id-token: write' and 'attestations: write'.
    required: false
    default: "true"
  ai-assess:
    description: >-
      Also ask an AI model (via GitHub Models) to weigh the open Dependabot
      alerts together with their SLA status (age, SLA, days over) and CISA KEV
      known-exploited data, and emit an overall release-risk verdict. Enabling
      this also changes enforcement: the deterministic SLA check becomes
      audit-only (a raw SLA violation never fails the job on its own) and
      blocking is delegated to the AI verdict — which already accounts for SLA
      status. The AI assessment is advisory by default and remains report-only
      in 'audit' mode; when mode is 'enforce', set 'severity-threshold' to let it
      block (that threshold is the AI verdict's fail-on level). When 'false'
      (default) no model is called and behavior is unchanged (the SLA gate
      enforces per 'mode').
    required: false
    default: "false"
  models-token:
    description: >-
      Token/key used to authenticate to the AI inference endpoint when
      'ai-assess' is true. For the default GitHub Models endpoint, requires
      'models: read' (the workflow GITHUB_TOKEN works — the Dependabot PAT in
      'github-token' usually lacks this scope). For other providers, pass their
      API key (OpenAI/OpenRouter/Groq/Azure) via a secret.
    required: false
    default: ${{ github.token }}
  ai-endpoint:
    description: >-
      Full URL of an OpenAI-compatible chat/completions endpoint. Defaults to
      GitHub Models (retired 2026-07-30 — override this to migrate). Examples:
      OpenAI 'https://api.openai.com/v1/chat/completions'; OpenRouter
      'https://openrouter.ai/api/v1/chat/completions'; Groq
      'https://api.groq.com/openai/v1/chat/completions'; Azure OpenAI
      'https://<resource>.openai.azure.com/openai/deployments/<deployment>/chat/completions?api-version=2024-10-21'.
      Only used when 'ai-assess' is true.
    required: false
    default: "https://models.github.ai/inference/chat/completions"
  ai-auth-scheme:
    description: >-
      How to send 'models-token' on the inference request. 'bearer' sends
      'Authorization: Bearer <token>' (works with OpenAI, OpenRouter, Groq,
      Azure with Entra tokens, and GitHub Models). 'api-key' sends 'api-key:
      <token>' (used by Azure OpenAI resource keys). Only used when 'ai-assess'
      is true.
    required: false
    default: "bearer"
  ai-model:
    description: >-
      Model id to use for the AI assessment. Value shape depends on the
      endpoint: GitHub Models expects '{publisher}/{model}' (e.g.
      'openai/gpt-4.1'); OpenAI expects a bare id (e.g. 'gpt-4.1'); Azure
      OpenAI uses the deployment name (often ignored when set in the URL).
      Only used when 'ai-assess' is true.
    required: false
    default: "openai/gpt-4.1"
  deployment-environment:
    description: >-
      Deployment environment and its exposure, given to the model to calibrate
      reachability and blast radius (e.g. "production - public internet-facing",
      "production - internal-only network"). Only used when 'ai-assess' is true.
    required: false
    default: "production - public internet-facing"
  app-context:
    description: >-
      Free-text description of what is being released and its exposure, given to
      the model as context. Only used when 'ai-assess' is true.
    required: false
    default: "A build being released to a public-facing, internet-exposed website."
  mitigations:
    description: >-
      Compensating controls already deployed in front of the build (e.g. a WAF,
      CDN with DDoS protection, network isolation, rate limiting), given to the
      model so it can weigh them when judging exploitability and blast radius.
      Treated as risk-reducing but not risk-eliminating. Only used when
      'ai-assess' is true. Empty (default) means none specified.
    required: false
    default: ""
  max-alerts:
    description: >-
      Maximum number of alerts to send to the model, highest-priority first
      (KEV-, severity-, and most-over-SLA-first), to bound the prompt size. The
      action also auto-trims the payload to stay within the model's input-token
      limit. Counts are always reported in full even when the list is truncated.
      Only used when 'ai-assess' is true.
    required: false
    default: "75"

outputs:
  result:
    description: >-
      Deterministic SLA gate result: 'pass', 'fail', or 'informational'. Always
      'informational' in 'audit' mode and whenever 'ai-assess' is true (the SLA
      check is audit-only when AI augmentation is enabled — see 'ai-result' for
      the enforcing verdict in that case).
    value: ${{ steps.gate.outputs.result }}
  violation-count:
    description: >-
      Number of in-scope open alerts over their SLA (in-scope = at or above
      'severity-threshold'; equals all violations when no threshold is set).
    value: ${{ steps.gate.outputs.violation-count }}
  enforced-violation-count:
    description: >-
      Violations subject to enforcement. Because the severity threshold both
      filters the alert set and defines the enforced scope, every surviving
      violation is enforceable — so this equals 'violation-count'. Retained for
      backward compatibility.
    value: ${{ steps.gate.outputs.enforced-violation-count }}
  audited-commit:
    description: "The commit SHA this review is tied to."
    value: ${{ steps.gate.outputs.audited-commit }}
  report-path:
    description: "Path to the JSON compliance report."
    value: ${{ steps.gate.outputs.report-path }}
  ai-result:
    description: >-
      AI gate outcome when 'ai-assess' is true: 'advisory' (no
      'severity-threshold' set, or 'audit' mode), 'pass', or 'fail'. Empty when
      AI assessment is disabled.
    value: ${{ steps.gate.outputs.ai-result }}
  ai-risk-level:
    description: "AI-assessed overall risk: critical | high | medium | low | minimal (empty when disabled)."
    value: ${{ steps.gate.outputs.ai-risk-level }}
  ai-recommendation:
    description: "AI release recommendation: block | conditional-go | go (empty when disabled)."
    value: ${{ steps.gate.outputs.ai-recommendation }}
  ai-summary:
    description: "One-line AI summary of the release risk (empty when disabled)."
    value: ${{ steps.gate.outputs.ai-summary }}
  kev-matched:
    description: >-
      Number of distinct CVEs across the open Dependabot alerts that are in the
      CISA KEV catalog (actively exploited). Empty when AI assessment is disabled.
    value: ${{ steps.gate.outputs.kev-matched }}
  attestation-url:
    description: >-
      URL of the signed provenance attestation for the compliance report file
      (empty if attestation was skipped). Record this as audit evidence.
    value: ${{ steps.attest.outputs.attestation-url }}
  bundle-attestation-url:
    description: >-
      URL of the signed provenance attestation for the uploaded artifact
      bundle (empty if upload or attestation was skipped). Record this as
      audit evidence.
    value: ${{ steps.attest-bundle.outputs.attestation-url }}

runs:
  using: "composite"
  steps:
    # Cache the CISA KEV catalog across runs (only needed for the AI assessment).
    # The key carries the UTC date so the cache refreshes once per day (the catalog
    # updates ~daily); every other run that day restores the small JSON map instead
    # of re-downloading it.
    - name: Resolve KEV cache metadata
      id: kev-cache-meta
      if: ${{ inputs.ai-assess == 'true' }}
      shell: bash
      run: |
        {
          echo "date=$(date -u +%Y-%m-%d)"
          echo "dir=${RUNNER_TEMP}/cisa-kev-cache"
        } >> "$GITHUB_OUTPUT"

    - name: Cache CISA KEV catalog
      if: ${{ inputs.ai-assess == 'true' }}
      uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
      with:
        path: ${{ steps.kev-cache-meta.outputs.dir }}
        key: cisa-kev-catalog-${{ steps.kev-cache-meta.outputs.date }}

    - name: Evaluate Dependabot alerts against SLA policy
      id: gate
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        REPOSITORY: ${{ inputs.repository }}
        MODE: ${{ inputs.mode }}
        SEVERITY_THRESHOLD: ${{ inputs.severity-threshold }}
        SLA_CRITICAL: ${{ inputs.sla-critical }}
        SLA_HIGH: ${{ inputs.sla-high }}
        SLA_MEDIUM: ${{ inputs.sla-medium }}
        SLA_LOW: ${{ inputs.sla-low }}
        # Optional AI risk assessment (no model is called unless AI_ASSESS=true).
        AI_ASSESS: ${{ inputs.ai-assess }}
        MODELS_TOKEN: ${{ inputs.models-token }}
        AI_ENDPOINT: ${{ inputs.ai-endpoint }}
        AI_AUTH_SCHEME: ${{ inputs.ai-auth-scheme }}
        AI_MODEL: ${{ inputs.ai-model }}
        DEPLOYMENT_ENVIRONMENT: ${{ inputs.deployment-environment }}
        APP_CONTEXT: ${{ inputs.app-context }}
        MITIGATIONS: ${{ inputs.mitigations }}
        MAX_ALERTS: ${{ inputs.max-alerts }}
        KEV_CACHE_DIR: ${{ steps.kev-cache-meta.outputs.dir }}
      run: bash "${{ github.action_path }}/risk_sla_gate.sh"

    - name: Sign compliance report (provenance attestation)
      id: attest
      # Keyless Sigstore signing via the workflow's OIDC identity. Binds the
      # report's SHA-256 digest to this run + commit and records it in the
      # public transparency log, so the report's authenticity and origin can
      # be proven during a later audit (gh attestation verify <file>).
      if: ${{ always() && inputs.attest-report == 'true' && steps.gate.outputs.report-path != '' }}
      uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
      with:
        subject-path: ${{ steps.gate.outputs.report-path }}

    - name: Upload compliance report artifact
      id: upload
      if: ${{ always() && inputs.upload-report == 'true' && steps.gate.outputs.report-path != '' }}
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
      with:
        name: risk-sla-gate-report-${{ github.sha }}
        path: ${{ steps.gate.outputs.report-path }}
        retention-days: ${{ inputs.report-retention-days }}

    - name: Sign uploaded artifact bundle (provenance attestation)
      id: attest-bundle
      # Attests the digest of the uploaded artifact zip itself (not just the
      # JSON inside it), so the exact bundle pulled from the run's artifacts
      # during an audit can be proven authentic and untampered.
      if: ${{ always() && inputs.attest-report == 'true' && steps.upload.outputs.artifact-digest != '' }}
      uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
      with:
        subject-name: risk-sla-gate-report-${{ github.sha }}.zip
        subject-digest: sha256:${{ steps.upload.outputs.artifact-digest }}