name: "Risk AI Advisor"

# Uses an AI model (via the Poe OpenAI-compatible API) to weigh open CodeQL
# and Dependabot alerts and produce an overall risk verdict for releasing the
# build to a public-facing website. Advisory by default; an operator can
# dispatch a blocking run via workflow_dispatch.
on:
  workflow_dispatch:
    inputs:
      deployment-environment:
        description: "Deployment environment + exposure the build targets (calibrates blast radius)."
        required: false
        default: "production - public internet-facing"
        type: choice
        options:
          - "production - public internet-facing"
          - "production - internal-only network"
          - "staging - public internet-facing"
          - "staging - internal-only network"
          - "development - internal-only network"
      # Compensating controls already deployed in front of the build. None are
      # selected by default; tick one or more on a manual run so the AI weighs
      # them when judging exploitability and blast radius. They lower practical
      # risk but are not treated as a guarantee (controls can be misconfigured or
      # bypassed), so a critical or known-exploited finding is never dismissed on
      # their basis alone.
      mitigation-waf:
        description: "Mitigation in place: Web Application Firewall (WAF) fronting the app."
        required: false
        default: false
        type: boolean
      mitigation-load-balancer:
        description: "Mitigation in place: load balancer / reverse proxy fronting the app."
        required: false
        default: false
        type: boolean
      mitigation-cdn-ddos:
        description: "Mitigation in place: CDN with DDoS protection."
        required: false
        default: false
        type: boolean
      mitigation-network-isolation:
        description: "Mitigation in place: network isolation / restricted ingress (not directly internet-reachable except via a controlled entry point)."
        required: false
        default: false
        type: boolean
      mitigation-rate-limiting:
        description: "Mitigation in place: rate limiting / request throttling on public endpoints."
        required: false
        default: false
        type: boolean
      additional-mitigations:
        description: "Other compensating controls in place (free text, comma-separated), e.g. authentication required, mTLS, IDS/IPS, RASP, secrets rotation."
        required: false
        default: ""
        type: string
      fail-on:
        description: "Risk levels that fail the job (e.g. 'critical,high'). Empty = advisory only."
        required: false
        default: ""
        type: string
      model:
        description: "Poe bot to use for the risk assessment (bare Poe bot name; see https://poe.com for the full catalog)."
        required: false
        default: "Claude-Sonnet-4.6"
        type: choice
        options:
          - "Claude-Sonnet-4.6"
          - "Claude-Opus-4.1"
          - "GPT-5"
          - "Gemini-2.5-Pro"
          - "Grok-4"
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  # Read CodeQL code-scanning alerts via the default GITHUB_TOKEN.
  security-events: read
  # Required for keyless Sigstore attestation via actions/attest-build-provenance.
  id-token: write
  attestations: write
  # NB: no 'models: read' — inference goes to Poe, not GitHub Models.

jobs:
  risk-ai-advisor:
    name: AI release-risk verdict
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      # Turn the per-mitigation checkboxes (only present on a workflow_dispatch
      # run) into a single human-readable list for the AI. Nothing ticked -> empty
      # output, which the advisor reads as "no compensating controls specified".
      - name: Compose selected mitigations
        id: mitigations
        shell: bash
        env:
          M_WAF: ${{ github.event.inputs.mitigation-waf }}
          M_LOAD_BALANCER: ${{ github.event.inputs.mitigation-load-balancer }}
          M_CDN_DDOS: ${{ github.event.inputs.mitigation-cdn-ddos }}
          M_NETWORK_ISOLATION: ${{ github.event.inputs.mitigation-network-isolation }}
          M_RATE_LIMITING: ${{ github.event.inputs.mitigation-rate-limiting }}
          M_ADDITIONAL: ${{ github.event.inputs.additional-mitigations }}
        run: |
          items=()
          [[ "$M_WAF" == "true" ]] && items+=("Web Application Firewall (WAF) fronting the application")
          [[ "$M_LOAD_BALANCER" == "true" ]] && items+=("Load balancer / reverse proxy fronting the application")
          [[ "$M_CDN_DDOS" == "true" ]] && items+=("CDN with DDoS protection")
          [[ "$M_NETWORK_ISOLATION" == "true" ]] && items+=("Network isolation / restricted ingress (not directly reachable from the public internet except via a controlled entry point)")
          [[ "$M_RATE_LIMITING" == "true" ]] && items+=("Rate limiting / request throttling on public endpoints")
          extra="$(printf '%s' "${M_ADDITIONAL:-}" | tr -d '\r' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')"
          [[ -n "$extra" ]] && items+=("$extra")
          list=""
          for i in "${items[@]}"; do
            [[ -n "$list" ]] && list+="; "
            list+="$i"
          done
          {
            echo "list<<__MITIG_EOF__"
            echo "$list"
            echo "__MITIG_EOF__"
          } >> "$GITHUB_OUTPUT"
          echo "Selected mitigations: ${list:-<none>}"

      - name: Assess release risk with AI
        id: advisor
        uses: ./.github/actions/risk_ai_advisor
        with:
          # The default GITHUB_TOKEN reads CodeQL alerts. It generally CANNOT
          # read Dependabot alerts — provide a fine-grained PAT (repository
          # permission "Dependabot alerts: read" + "Metadata: read") or a
          # GitHub App installation token via this secret. If the secret is
          # absent the advisor proceeds on CodeQL alerts alone.
          dependabot-token: ${{ secrets.DEPENDABOT_ALERTS_TOKEN || github.token }}
          # GitHub Models retired 2026-07-30; route inference to Poe's
          # OpenAI-compatible endpoint. POE_API_KEY must be defined as a
          # repo/org secret with a valid Poe API key.
          ai-endpoint: https://api.poe.com/v1/chat/completions
          ai-auth-scheme: bearer
          models-token: ${{ secrets.POE_API_KEY }}
          model: ${{ github.event.inputs.model || 'Claude-Sonnet-4.6' }}
          # Defaults to the highest-exposure case on non-dispatch triggers.
          deployment-environment: ${{ github.event.inputs.deployment-environment || 'production - public internet-facing' }}
          # Release context is derived from the selected environment so the two
          # always agree (no "internet-exposed" context for an internal target).
          app-context: >-
            A build being released to a "${{ github.event.inputs.deployment-environment || 'production - public internet-facing' }}"
            deployment environment. Judge exploitability and blast radius by that
            environment's exposure — treat "public internet-facing" as reachable
            from the internet and "internal-only" as reachable only from within a
            restricted internal network.
          # Compensating controls selected for this run (empty on non-dispatch
          # triggers); the AI weighs them in its exploitability/blast-radius call.
          mitigations: ${{ steps.mitigations.outputs.list }}
          # Advisory by default; dispatch with a value to gate the release.
          fail-on: ${{ github.event.inputs.fail-on || '' }}
          max-alerts: "75"
          upload-report: "true"
          report-retention-days: "90"

      - name: Echo verdict
        if: always()
        run: |
          echo "Result:         ${{ steps.advisor.outputs.result }}"
          echo "Risk level:     ${{ steps.advisor.outputs.risk-level }}"
          echo "Recommendation: ${{ steps.advisor.outputs.recommendation }}"
          echo "Open CodeQL:     ${{ steps.advisor.outputs.codeql-open }}"
          echo "Open Dependabot: ${{ steps.advisor.outputs.dependabot-open }}"
          echo "KEV matched:     ${{ steps.advisor.outputs.kev-matched }}"
          echo "Audited commit: ${{ steps.advisor.outputs.audited-commit }}"
          echo "Report path:    ${{ steps.advisor.outputs.report-path }}"
          echo "Summary:        ${{ steps.advisor.outputs.summary }}"
