name: "Risk SLA Gate"

# Audits open Dependabot alerts against severity-based remediation SLAs and
# ties the result to the audited commit. Runs on demand, on a daily schedule,
# and on pushes/PRs to the default branch.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "'enforce' or 'audit' (report only). With ai_assess=true the SLA check is always audit-only; enforce delegates blocking to the AI verdict."
        required: false
        default: "audit"
        type: choice
        options:
          - audit
          - enforce
      ai_assess:
        description: "Also run the AI risk assessment (SLA- and KEV-aware verdict). When on, the SLA check is audit-only and the AI verdict drives enforcement."
        required: false
        default: false
        type: boolean
      ai_fail_on:
        description: "AI risk threshold that fails the job (empty = advisory only). Used with ai_assess=true + mode=enforce to block on the AI verdict."
        required: false
        default: ""
        type: choice
        options:
          - ""
          - critical
          - high
          - medium
          - low
          - minimal
  schedule:
    # Daily at 06:17 UTC. Schedules always run against the default branch.
    - cron: "17 6 * * *"
  push:
    branches: [main]
  pull_request:

permissions:
  # The action only reads repository contents; Dependabot alerts are read via
  # the dedicated token secret below, not the default GITHUB_TOKEN.
  contents: read
  # Required to sign the compliance report with a build-provenance attestation:
  # id-token mints the OIDC token for keyless Sigstore signing, and
  # attestations lets the run persist the signed attestation to the repo.
  id-token: write
  attestations: write
  # Required only when the optional AI risk assessment is enabled (ai-assess):
  # the action calls the GitHub Models inference API with the workflow token.
  models: read

jobs:
  risk-sla-gate:
    name: Audit Dependabot SLAs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Risk SLA Gate
        id: gate
        uses: ./.github/actions/risk_sla_gate
        with:
          # The default GITHUB_TOKEN generally CANNOT read Dependabot alerts.
          # Provide a fine-grained PAT (repository permission
          # "Dependabot alerts: read" + "Metadata: read") or a GitHub App
          # installation token via this secret.
          github-token: ${{ secrets.DEPENDABOT_ALERTS_TOKEN }}
          # Default to 'audit' so scheduled/PR runs never block; allow an
          # operator to dispatch an enforcing run via workflow_dispatch. When
          # ai-assess is true the SLA check is audit-only regardless of mode and
          # enforcement is delegated to the AI verdict (see ai-fail-on below).
          mode: ${{ github.event.inputs.mode || 'audit' }}
          # Only applied when ai-assess is false; with AI augmentation on, the
          # SLA check never fails the job on its own so these severities are
          # reported but not enforced.
          enforce-severities: "critical,high"
          sla-critical: "7"
          sla-high: "30"
          sla-medium: "60"
          sla-low: "90"
          upload-report: "true"
          # Kept at the repository's default 90-day artifact retention cap.
          # Requesting more than the repo maximum is silently clamped (and warns),
          # so raise "Settings → Actions → Artifact and log retention" first if a
          # longer audit-retention window is required.
          report-retention-days: "90"
          # Optional AI risk assessment. Off unless dispatched with ai_assess=true.
          # Advisory by default; scheduled/PR runs never call the model. When on,
          # the SLA check is audit-only and the AI verdict (below) is what can
          # block, so failure is aligned with the AI augmentation, not raw SLA
          # violations.
          ai-assess: ${{ github.event.inputs.ai_assess || 'false' }}
          # The Dependabot PAT typically lacks 'models: read'; use the workflow
          # token for the GitHub Models inference call.
          models-token: ${{ github.token }}
          # The enforcement control when ai-assess is true: with mode=enforce, the
          # job fails when the AI verdict meets this threshold. Empty = advisory.
          ai-fail-on: ${{ github.event.inputs.ai_fail_on || '' }}
          deployment-environment: "production - public internet-facing"

      - name: Echo gate result
        if: always()
        run: |
          echo "Result:                    ${{ steps.gate.outputs.result }}"
          echo "Audited commit:            ${{ steps.gate.outputs.audited-commit }}"
          echo "Total SLA violations:      ${{ steps.gate.outputs.violation-count }}"
          echo "Enforced violations:       ${{ steps.gate.outputs.enforced-violation-count }}"
          echo "Compliance report path:    ${{ steps.gate.outputs.report-path }}"
          echo "Signed report attestation: ${{ steps.gate.outputs.attestation-url }}"
          echo "Signed bundle attestation: ${{ steps.gate.outputs.bundle-attestation-url }}"
          echo "AI result:                 ${{ steps.gate.outputs.ai-result }}"
          echo "AI risk level:             ${{ steps.gate.outputs.ai-risk-level }}"
          echo "AI recommendation:         ${{ steps.gate.outputs.ai-recommendation }}"
          echo "Known-exploited (KEV):     ${{ steps.gate.outputs.kev-matched }}"
          echo "AI summary:                ${{ steps.gate.outputs.ai-summary }}"
